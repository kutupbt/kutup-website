# Cloudflare Workers (static assets + one small Worker) config — the repo is connected to Workers
# Builds, which runs `npx wrangler versions upload` on push. The [build] command
# generates dist/ before upload. The custom domain (kutup.dev) is attached in
# the Cloudflare dashboard.
name = "kutup-website"
compatibility_date = "2025-06-09"
# The Worker in front of the static site. It only handles Kutup's federation
# discovery and Web Key Directory (worker/index.js); every other request is a
# static asset.
main = "worker/index.js"

[build]
command = "pnpm run build"

[vars]
# Where the public Kutup server (the one whose accounts are name@kutup.dev)
# is reached. Its SERVER_URL.
KUTUP_SERVER_ORIGIN = "https://account.kutup.dev"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/.well-known/kutup/*", "/.well-known/openpgpkey/*"]
